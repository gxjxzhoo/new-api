name: Copy secrets to another repo (manual)

on:
  workflow_dispatch:
    inputs:
      repo:
        description: '目标仓库 (owner/name)'
        required: true
      keys:
        description: '要复制的 Secret 名，空格分隔（仅支持 SAP_EMAIL SAP_PASSWORD TG_BOT_TOKEN TG_CHAT_ID PRIVATE_REPO_TOKEN）'
        required: true
        default: SAP_EMAIL SAP_PASSWORD TG_BOT_TOKEN TG_CHAT_ID

jobs:
  copy:
    runs-on: ubuntu-24.04
    steps:
      - name: 复制
        env:
          REPO: ${{ inputs.repo }}
          KEYS: ${{ inputs.keys }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          V_SAP_EMAIL: ${{ secrets.SAP_EMAIL }}
          V_SAP_PASSWORD: ${{ secrets.SAP_PASSWORD }}
          V_TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          V_TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          V_PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -e
          GH_TOKEN=$(curl -fsSL -H "Authorization: Bearer $PRIVATE_REPO_TOKEN" -H "Accept: application/vnd.github.raw" \
            https://api.github.com/repos/gxjxzhoo/env-config/contents/.env | grep -m1 '^GH_TOKEN=' | cut -d= -f2-)
          echo "::add-mask::$GH_TOKEN"; export GH_TOKEN
          [ -n "$GH_TOKEN" ] || { echo "::error::读不到 GH_TOKEN"; exit 1; }
          for k in $KEYS; do
            vn="V_$k"; v="${!vn}"
            [ -n "$v" ] || { echo "::warning::$k 为空，跳过"; continue; }
            printf '%s' "$v" | gh secret set "$k" -R "$REPO"
            echo "已复制 $k -> $REPO"
          done
